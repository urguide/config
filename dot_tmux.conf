## [新增] 用絕對路徑指定 cclimits 執行檔
## tmux server 的 PATH 不是互動 shell 的 PATH: 它繼承自啟動 server 的那個 process,
## 裡面沒有 ~/.local/bin. 而 ~/.local/bin/cclimits-tmux 是「複本」不是 symlink,
## 所以 wrapper 的三段解析(CCLIMITS_BIN -> 相鄰的 ../lib/cclimits.py -> PATH)全部落空,
## 背景查詢每次都 exit 127, status bar 只能一直吃舊快取.
## 設這個變數是三段解析裡最穩的一段, 不受 PATH 與安裝方式影響.
set-environment -g CCLIMITS_BIN "$HOME/.local/bin/cclimits"

