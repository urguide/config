##   Claude=U+EC82 cod-claude / Codex=U+EC81 cod-openai / Grok=U+EB72 cod-twitter
##   48 欄 -> 36 欄, 省 12 欄. Nerd Font 3.5.0 裡沒有 xAI logo, 所以 Grok 用 twitter 代替
##   注意: 這需要終端機字型是 Nerd Font, 沒有的話會變成豆腐方塊
set-environment -g CCLIMITS_TMUX_ARGS "--claude --codex --grok --oneline both --compact --resets --icons"
