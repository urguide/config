####################################################################
## Agent 狀態偵測 (模仿 herdr)  以下整區都是新增的
## 純 tmux format 實作, 不需要任何外部腳本 / 背景 daemon / 修改 agent 設定
##
## 顯示效果: window status 最前面一個圖示
##   形狀 = 哪個 agent      ■ opencode   ● claude   ◆ codex   ▲ grok
##   顏色 = 目前狀態        紅閃 blocked  黃 working  綠 done  白 idle
##   沒開 agent 的 window 完全不顯示 (零寬度, 不影響原本排版)
##
## 資料流 (由下往上疊):
##   @agent_real/@agent_wrap  認得的指令名稱白名單
##   @agent_ui                畫面上有沒有 agent TUI 特徵 (給 wrapper 用)
##   @agent_is                這個 pane 是不是 agent
##   @agent_state   (pane)    blocked / working / idle / 空
##   @agent_shape   (pane)    ■ ● ◆ ▲
##   @agent_pane    (window)  把該 window 全部 pane 壓成字串, 例如 "BI"
##   @agent_wshape  (window)  該 window 要顯示哪個形狀
##   @agent_roll    (window)  彙總成單一狀態, 優先序 blocked>working>done>idle
##   @agent_dot     (window)  最終上色好的圖示 -> 被 window-status-format 引用
##
## 維護方式: agent 改版導致偵測失準時, 改 @agent_state 或 @agent_ui 的比對字串,
##           然後 prefix + r 重載. 用 prefix + A 可以看目前 pane 的判定結果.
####################################################################

## [新增] 第一關 A: agent 執行檔名稱白名單. 指令名直接命中就確定是 agent,
## 不需要再掃畫面 -> 這是效能的關鍵短路, 一般 shell pane 幾乎零成本
setw -g @agent_real '^(claude|codex|opencode|droid|gemini|cursor-agent|amp|kimi|copilot|grok|kilo|hermes|qodercli)$'
## [新增] 第一關 B: wrapper 名單. su/sudo 到別的帳號時 sudo 會另開一個 pty,
## tmux 的 pane_current_command 只看得到 "sudo", 看不到底下真正的 agent,
## 所以這些名稱要放行到第二關(比畫面)才能判定, 不能直接當成非 agent
setw -g @agent_wrap '^(sudo|su|ssh|mosh|docker|podman|distrobox|toolbox|nsenter|env|script)$'
## [新增] 相容用別名, 讓舊的 @agent_cmds 寫法仍可運作 (目前僅 prefix+A 除錯用)
setw -g @agent_cmds '#{E:@agent_real}'

## [新增] 第二關: 用畫面內容判斷有沒有 agent TUI. 只有 wrapper 情況才會用到.
## 之所以可行: #{C:} 搜尋的是 tmux pane 的畫面文字, 跟哪個 UID 在跑無關,
## 所以 sudo/su 到別的帳號跑 agent 一樣抓得到 (實測有效)
## 條件是「畫框線 AND 提示列關鍵字」兩者同時成立, 只有其中一個不算.
## 這是為了避免在一般 shell 裡 echo 到幾個關鍵字就被誤判成 agent (實測會誤判)
##   畫框線: [│┃╭╰▛▜] 直線/圓角框(codex opencode 的外框, claude 的 logo)
##           或 ───── 連續橫線 (claude 的輸入框上下緣, 不含框角字元)
##   提示列: ctrl+p(opencode) / ? for shortcuts(claude) / › 提示符+/model(codex)
setw -g @agent_ui '#{&&:#{||:#{C/r:[│┃╭╰▛▜]},#{C:*─────*}},#{||:#{C:*ctrl+p*},#{||:#{C:*tab agents*},#{||:#{C/r:(esc|Esc) (to )?interrupt},#{||:#{C:*? for shortcuts*},#{||:#{C:*/help for help*},#{||:#{C/r:^\s*[›❯]\s},#{C:*/model*}}}}}}}}'

## [新增] 綜合判定「這個 pane 是不是 agent」, 回傳 1 / 0
## 效能關鍵: 指令名命中就直接回 1, 完全跳過 @agent_ui 裡的 9 次 #{C:} 畫面搜尋.
## 只有 sudo/su 這類 wrapper 才需要付掃畫面的代價 (實測讓重繪從 43ms 降到 21ms)
setw -g @agent_is '#{?#{m/r:#{E:@agent_real},#{pane_current_command}},1,#{?#{m/r:#{E:@agent_wrap},#{pane_current_command}},#{E:@agent_ui},0}}'

## [新增] 單一 pane 的狀態: blocked / working / idle / 空字串(非 agent)
## #{C:} 只搜尋「目前可見畫面」(捲上去的歷史不算), 語意等同 herdr 的
## live bottom-buffer snapshot; 實測捲出畫面的文字不會被搜到
## 注意 #{C:} 回傳的是「第一個」符合的行號, 不是最後一個, 所以無法用行號
## 判斷是否在畫面底部, 只能靠 ^ 錨定行首來排除誤判
## blocked 判定 (三種任一):
##   1. 選單式  ❯ 1. Yes / › 1. Yes, proceed  <- 必須有游標符號+空白+編號,
##      這樣寫是因為只比對 "1. Yes" 會誤中 agent 畫面上的對話文字(實測踩過)
##   2. 問句式  Do you want / Allow command / Allow tool / Proceed?
##   3. 傳統式  [y/N] 或 (y/n)
## working 判定 (兩種任一):
##   1. esc to interrupt / Esc to interrupt / esc interrupt  <- 三家共通, 最可靠
##   2. 行首 spinner + Thinking/Working/Running/Generating/Processing
##      (claude 的 spinner 字樣很多變: Cooked/Herding/Pondering..., 所以主要靠第 1 種)
## 都不符合就是 idle, 跟 herdr 一樣保守, 不會亂猜 blocked
setw -g @agent_state "#{?#{E:@agent_is},#{?#{||:#{C/r:^\\s*[│┃]?\\s*[›❯>]\\s+[0-9]\\.\\s+(Yes|No|Allow|Approve|Accept)},#{||:#{C/r:^\\s*[│┃]?\\s*(Do you want|Allow command|Allow tool|Allow this|Proceed\\?)},#{C/r:\\[y/N\\]|\\(y/n\\)}}},blocked,#{?#{||:#{C/r:(esc|Esc) (to )?interrupt},#{C/r:^\\s*[│┃]?\\s*[✻✽✢∗⏺]?\\s*(Thinking|Working|Running|Generating|Processing)}},working,idle}},}"

## [新增] 把該 window 內所有 pane 的狀態壓成一個字串
## B=blocked W=working I=idle 非agent=不放字元. 例如 "BI" = 一個blocked + 一個idle
setw -g @agent_pane '#{P:#{?#{==:#{E:@agent_state},blocked},B,#{?#{==:#{E:@agent_state},working},W,#{?#{==:#{E:@agent_state},idle},I,}}}}'

## [新增] 單一 pane 是哪個 agent -> 對應形狀
##   ■ opencode(實心方框)  ● claude(實心圓)  ◆ codex(實心菱形)  ▲ grok(實心三角)
## 前四層用 pane_current_command 判斷(便宜且準確);
## 後面幾層是 wrapper 的 fallback: su/sudo 時看不到真正的指令名, 只能靠畫面特徵
##   ctrl+p commands = opencode 的提示列
##   ? for shortcuts = claude 的提示列
##   /status         = codex 的提示列
## 最後一層 #{?#{E:@agent_state},■,} 是保險: 確定是 agent 但認不出是哪家就給 ■
setw -g @agent_shape '#{?#{m/r:^opencode$,#{pane_current_command}},■,#{?#{m/r:^claude$,#{pane_current_command}},●,#{?#{m/r:^codex$,#{pane_current_command}},◆,#{?#{m/r:^grok$,#{pane_current_command}},▲,#{?#{C:*ctrl+p commands*},■,#{?#{C:*? for shortcuts*},●,#{?#{C:*/status*},◆,#{?#{E:@agent_state},■,}}}}}}}}'

## [新增] 該 window 要顯示哪個形狀 = 第一個有 agent 的 pane 的形狀
## #{=1:} 只取結果字串的第一個字元 (一個 window 開多個 agent 時只顯示第一個)
setw -g @agent_wshape '#{=1:#{P:#{?#{E:@agent_state},#{E:@agent_shape},}}}'

## [新增] window 層彙總, 優先序 blocked > working > done > idle > none
## done 的定義: agent 已做完(idle) 但你還沒切過去看
##   靠 window_activity_flag 實現, 不能只用 window_bell_flag, 因為很多 agent
##   完工時根本不送 BEL; 而 agent 完工一定會有畫面輸出 -> 一定會點亮 activity flag.
##   而且中途看一眼會清掉 flag, 但之後完工的輸出會再次點亮它 -> 綠色仍會出現
##   (這正是先前「看過一眼後方框就消失」那個 bug 的修法)
## 寫法說明: 用 s/// 替換鏈, 讓 @agent_pane 只被求值 1 次 (原本巢狀 #{?} 會求值 3 次,
##   每次求值都連帶重跑所有 pane 的 #{C:} 畫面搜尋, 是狀態列卡頓的主因)
##   先把 B/W/I 換成數字哨兵 9/8/7 (數字不會跟 BWI 撞), 再把哨兵換成狀態名.
##   順序很重要: 必須先換完哨兵再換文字, 否則替換結果會被後面的 pattern 再次匹配
setw -g @agent_roll '#{?#{E:@agent_pane},#{s/9/blocked/:#{s/8/working/:#{s/7/#{?#{||:#{window_activity_flag},#{window_bell_flag}},done,idle}/:#{s/^.*I.*$/7/:#{s/^.*W.*$/8/:#{s/^.*B.*$/9/:#{E:@agent_pane}}}}}}},none}'

## 狀態圖示, 放在 window status 最前面
## 形狀 = agent 種類 (■opencode ●claude ◆codex ▲grok)
## 顏色 = 狀態: 紅閃=blocked 深黃=working 深綠=done 白=idle(開著但沒做事)
## 只要 AI 工具開著圖形就持續存在; 沒開 agent 的 window 完全不顯示
## 用 256 色的深色版本(colour178 深金黃 / colour28 深綠)取代預設的 yellow/green,
## 因為預設的亮黃亮綠彼此太接近, 深色版辨識度較好
## 效能: 用 s/// 一次替換代替 4 層巢狀 #{?}, 避免 @agent_roll 被重複求值 4 次
## (每次求值都會連帶重跑底下所有 pane 的 #{C:} 畫面搜尋, 是狀態列卡頓的主因)
setw -g @agent_dot '#{?#{E:@agent_wshape},#{s/blocked/#[fg=red bg=default blink]/:#{s/working/#[fg=colour178 bg=default]/:#{s/done/#[fg=colour28 bg=default]/:#{s/idle/#[fg=white bg=default bright]/:#{E:@agent_roll}}}}}#{E:@agent_wshape}#[default],}'

## [改] 原本是預設的 15 秒, 改成 2 秒
## 這就是狀態偵測的延遲上限: agent 變成 blocked 後最多 2 秒圖示才會更新
## 不設更短是因為每次重繪都要跑 #{C:} 畫面搜尋; 實測全部 window 一輪約 21ms,
## 2 秒一次的成本可忽略, 但設成 0.5 秒就會在快速打字時感覺到頓挫
set -g status-interval 15

## [新增] 響鈴設定: agent 要你批准時會送出 BEL, 這裡讓它真的發出聲音
## 千萬不要用 visual-bell both 或 on!
##   那會讓 tmux 顯示一則訊息「整條蓋掉 status bar」, 過 display-time(750ms) 才還原,
##   看起來就是狀態列突然消失又出現的抖動 (先前那個抖動 bug 就是這樣造成的)
## off 的意思是「不要用訊息取代, 直接把 BEL 傳給終端」-> 有聲音, 且完全不動 status bar
set -g visual-bell off
## 任何 window 響鈴都要通知我, 不限於目前所在的 window (agent 常在背景跑完才叫人)
set -g bell-action any
## 開啟響鈴監看, 這樣 window_bell_flag 才會被設起來 (@agent_roll 的 done 判定會用到)
setw -g monitor-bell on

## [新增] activity 監看: done(綠色)狀態需要 window_activity_flag, 所以必須開啟
setw -g monitor-activity on
## activity 只用來當「這個 window 有新輸出」的旗標, 不需要任何提示打擾我.
## none = 既不響鈴也不跳訊息, 但 window_activity_flag 照樣會被設起來.
## 注意: 不能用 visual-activity off 來達成安靜! 在 tmux 裡 off 的定義是「送出響鈴」,
##       會導致背景 agent 一有輸出就嗶一聲; 而 visual-activity on 則會跳訊息蓋掉
##       status bar. 兩個都不要的唯一正解就是 activity-action none
set -g activity-action none
## [新增] tmux 訊息(例如 prefix+A 的除錯輸出)的配色
set -g message-style 'fg=black,bg=red,bold'
## [新增] 關掉 tmux 內建的 activity/bell 反白效果
## 預設值是 reverse, 會把整個 window status 反白, 蓋掉我們自己的圖示配色
setw -g window-status-activity-style default
## [新增] 同上, 響鈴時也不要反白
setw -g window-status-bell-style default

## [新增] prefix + a = agent 總覽面板 (等同 herdr 的 sidebar)
## 用 choose-tree -Zw: -Z 放大並附帶「即時 pane 畫面預覽」(真實終端內容, 非解讀),
## -w 讓 window 預設展開; 選好按 Enter 就直接跳到那個 pane
## -F 自訂每一行的顯示格式, 分成三種情況:
##   pane 那一行   -> 顯示 ▲BLOCKED / ◐working / ○idle 或指令名, 加上目錄
##   window 那一行 -> 顯示 window 編號 + 彙總狀態 + 目錄 (none 時不顯示狀態字)
##   session 那一行-> 顯示 session 名稱
bind-key a choose-tree -Zw -F '#{?pane_format,#{?#{==:#{E:@agent_state},blocked},#[fg=red]▲ BLOCKED#[default],#{?#{==:#{E:@agent_state},working},#[fg=yellow]◐ working#[default],#{?#{==:#{E:@agent_state},idle},#[fg=green]○ idle#[default],  #{p9:pane_current_command}}}} #{b:pane_current_path},#{?window_format,#{window_index}: #{?#{==:#{E:@agent_roll},none},,#{E:@agent_roll} }#{b:pane_current_path},#{session_name}}}'

## [新增] prefix + A = 除錯用, 顯示目前 pane 的判定結果 (等同 herdr agent explain)
## 偵測不準時按這個, 可以看到 tmux 認到的指令名、pane 狀態、window 彙總狀態,
## 以及 @agent_pane 的原始字串, 用來反推該調哪一條比對規則. -d 4000 = 顯示 4 秒
bind-key A display-message -d 4000 'pane=#{pane_id} cmd=#{pane_current_command} state=[#{E:@agent_state}] win_roll=[#{E:@agent_roll}] panes=[#{E:@agent_pane}] bell=#{window_bell_flag}'
