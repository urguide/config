[colors.normal]
green = '#3d942c'
blue = '#2457b5'


[cursor.style]
blinking = "Always"
shape = "Beam"

[env]
TERM = "xterm-256color"

[font]
size = 14.0

[font.bold]
family = "VictorMono Nerd Font"
style = "Bold"

[font.bold_italic]
family = "VictorMono Nerd Font"
style = "Bold Italic"

[font.italic]
family = "VictorMono Nerd Font"
style = "Italic"

[font.normal]
family = "VictorMono Nerd Font"
style = "Light"

[[keyboard.bindings]]
action = "Paste"
key = "V"
mods = "Control"

[[keyboard.bindings]]
chars = "\u001B[5~"
key = "K"
mods = "Control"

[[keyboard.bindings]]
chars = "\u001B[5~"
key = "K"
mods = "Command"

[[keyboard.bindings]]
chars = "\u001B[6~"
key = "J"
mods = "Command"

[[keyboard.bindings]]
chars = "\u001B[6~"
key = "J"
mods = "Control"

[[keyboard.bindings]]
chars = "\r"
key = "NumpadEnter"

[[keyboard.bindings]]
chars = "\u001BOH"
key = "Left"
mode = "AppCursor"
mods = "Command"

[[keyboard.bindings]]
chars = "\u001BOF"
key = "Right"
mode = "AppCursor"
mods = "Command"

[[keyboard.bindings]]
chars = "\u0017"
key = "W"
mods = "Command"

[[keyboard.bindings]]
action = "ToggleMaximized"
key = "F12"

[selection]
save_to_clipboard = true
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

[window]
dynamic_title = false
startup_mode = "Maximized"

[window.padding]
x = 5
y = 0
